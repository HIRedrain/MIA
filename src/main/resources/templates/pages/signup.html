<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIA | Sign Up</title>

    <link rel="stylesheet" href="/css/mia.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body class="login-page">

<main class="login-shell">

    <section class="login-brand-panel">

        <div class="login-brand">
            <div class="login-logo">M</div>

            <div>
                <p class="login-eyebrow">INSTAGRAM AUTOMATION</p>
                <h1>MIA</h1>
            </div>
        </div>

        <div class="login-copy">
            <span class="login-copy-kicker">JOIN MIA</span>

            <h2>
                간단하게 시작하고,<br>
                필요할 때 확장하세요.
            </h2>
        </div>

        <div class="linen-shape linen-shape-one"></div>
        <div class="linen-shape linen-shape-two"></div>
    </section>


    <section class="login-form-panel">

        <a href="/" class="login-home-button" aria-label="홈으로 이동" title="홈">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 1 0 2.354 7.854L3 7.207V13.5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5V7.207l.646.647a.5.5 0 0 0 .708-.708zM12 6.207V13.5a.5.5 0 0 1-.5.5H10v-4.5A1.5 1.5 0 0 0 8.5 8h-1A1.5 1.5 0 0 0 6 9.5V14H4.5a.5.5 0 0 1-.5-.5V6.207l4-4zM9 14H7V9.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5z"/>
            </svg>
        </a>


        <div class="login-card signup-card">

            <header class="login-card-header">
                <span>CREATE ACCOUNT</span>
                <h2>MIA 회원 가입</h2>
                <p>사용하실 계정 정보를 입력해 주세요.</p>
            </header>

            <form id="signupForm">

                <div class="login-field">
                    <label for="loginId">아이디</label>

                    <input
                        id="loginId"
                        name="loginId"
                        type="text"
                        maxlength="20"
                        autocomplete="username"
                        placeholder="아이디를 입력해 주세요"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="userNickname">별명</label>

                    <input
                        id="userNickname"
                        name="userNickname"
                        type="text"
                        maxlength="20"
                        autocomplete="nickname"
                        placeholder="별명을 입력해 주세요"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="loginPw">비밀번호</label>

                    <div class="password-wrap">
                        <input
                            id="loginPw"
                            name="loginPw"
                            type="password"
                            minlength="5"
                            maxlength="50"
                            autocomplete="new-password"
                            inputmode="latin"
                            placeholder="영문 기준 5자 이상 입력해 주세요"
                            required
                        >

                        <button
                            type="button"
                            id="passwordToggle"
                            class="password-toggle"
                            aria-label="비밀번호 보기"
                        >
                            보기
                        </button>
                    </div>
                </div>

                <div class="login-field">
                    <label for="loginPwConfirm">비밀번호 확인</label>

                    <input
                        id="loginPwConfirm"
                        name="loginPwConfirm"
                        type="password"
                        minlength="5"
                        maxlength="50"
                        autocomplete="new-password"
                        inputmode="latin"
                        placeholder="비밀번호를 다시 입력해 주세요"
                        required
                    >
                </div>

                <button
                    id="signupButton"
                    class="login-submit"
                    type="submit"
                >
                    회원 가입
                </button>

                <div class="auth-switch">
                    <span>이미 계정이 있으신가요?</span>
                    <a href="/login">로그인</a>
                </div>

            </form>

        </div>

        <p class="login-footer">
            MIA · Instagram Message Automation
        </p>

    </section>

</main>

<script src="/js/signup.js"></script>

</body>
</html>
