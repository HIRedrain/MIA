<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIA | Sign Up</title>

    <link rel="stylesheet" href="/css/mia.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body class="login-page">

<main class="login-shell">

    <section class="login-brand-panel">

        <div class="login-brand">
            <div class="login-logo">M</div>

            <div>
                <p class="login-eyebrow">INSTAGRAM AUTOMATION</p>
                <h1>MIA</h1>
            </div>
        </div>

        <div class="login-copy">
            <span class="login-copy-kicker">JOIN MIA</span>

            <h2>
                간단하게 시작하고,<br>
                필요할 때 확장하세요.
            </h2>

            <p>
                회원가입 계정은 기본적으로 CLIENT 권한으로 생성됩니다.
            </p>
        </div>

        <div class="linen-shape linen-shape-one"></div>
        <div class="linen-shape linen-shape-two"></div>
    </section>


    <section class="login-form-panel">

        <div class="login-card signup-card">

            <header class="login-card-header">
                <span>CREATE ACCOUNT</span>
                <h2>MIA 회원가입</h2>
                <p>사용하실 계정 정보를 입력해 주세요.</p>
            </header>

            <form id="signupForm">

                <div class="login-field">
                    <label for="loginId">아이디</label>

                    <input
                        id="loginId"
                        name="loginId"
                        type="text"
                        maxlength="20"
                        autocomplete="username"
                        placeholder="아이디를 입력해 주세요"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="userNickname">닉네임</label>

                    <input
                        id="userNickname"
                        name="userNickname"
                        type="text"
                        maxlength="20"
                        autocomplete="nickname"
                        placeholder="닉네임을 입력해 주세요"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="loginPw">비밀번호</label>

                    <div class="password-wrap">
                        <input
                            id="loginPw"
                            name="loginPw"
                            type="password"
                            minlength="5"
                            maxlength="50"
                            autocomplete="new-password"
                            inputmode="latin"
                            placeholder="영문 기준 5자 이상 입력해 주세요"
                            required
                        >

                        <button
                            type="button"
                            id="passwordToggle"
                            class="password-toggle"
                            aria-label="비밀번호 보기"
                        >
                            보기
                        </button>
                    </div>
                </div>

                <div class="login-field">
                    <label for="loginPwConfirm">비밀번호 확인</label>

                    <input
                        id="loginPwConfirm"
                        name="loginPwConfirm"
                        type="password"
                        minlength="5"
                        maxlength="50"
                        autocomplete="new-password"
                        inputmode="latin"
                        placeholder="비밀번호를 다시 입력해 주세요"
                        required
                    >
                </div>

                <button
                    id="signupButton"
                    class="login-submit"
                    type="submit"
                >
                    회원가입
                </button>

                <div class="auth-switch">
                    <span>이미 계정이 있으신가요?</span>
                    <a href="/login">로그인</a>
                </div>

            </form>

        </div>

        <p class="login-footer">
            MIA · Instagram Message Automation
        </p>

    </section>

</main>

<script src="/js/signup.js"></script>

</body>
</html>
