<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA | Login</title>
    <link rel="stylesheet" href="/css/mia.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-brand-panel">
        <div class="login-brand-row">
            <div class="login-brand">
                <div class="login-logo">M</div>
                <div>
                    <p class="login-eyebrow">INSTAGRAM AUTOMATION</p>
                    <h1>MIA</h1>
                </div>
            </div>
        </div>

        <div class="login-copy">
            <span class="login-copy-kicker">MIA</span>
            <h2>필요한 순간에,<br>필요한 메시지를.</h2>
            <p>Instagram 게시물과 댓글을 관리하고 고객에게 필요한 정보를 자동으로 전달합니다.</p>
        </div>

        <div class="linen-shape linen-shape-one"></div>
        <div class="linen-shape linen-shape-two"></div>
    </section>

    <section class="login-form-panel">

        <a href="/" class="login-home-button" aria-label="홈으로 이동" title="홈">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 1 0 2.354 7.854L3 7.207V13.5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5V7.207l.646.647a.5.5 0 0 0 .708-.708zM12 6.207V13.5a.5.5 0 0 1-.5.5H10v-4.5A1.5 1.5 0 0 0 8.5 8h-1A1.5 1.5 0 0 0 6 9.5V14H4.5a.5.5 0 0 1-.5-.5V6.207l4-4zM9 14H7V9.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5z"/>
            </svg>
        </a>

        <div class="login-card">
            <header class="login-card-header">
                <span>WELCOME BACK</span>
                <h2>MIA 로그인</h2>
                <p>MIA 계정으로 로그인해 주세요.</p>
            </header>

            <form id="loginForm">
                <div class="login-field">
                    <label for="loginId">아이디</label>
                    <input id="loginId" name="loginId" type="text" maxlength="20" autocomplete="username" placeholder="아이디를 입력해 주세요" required>
                </div>

                <div class="login-field">
                    <label for="loginPw">비밀번호</label>
                    <div class="password-wrap">
                        <input id="loginPw" name="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요" required>
                        <button type="button" id="passwordToggle" class="password-toggle" aria-label="비밀번호 보기">보기</button>
                    </div>
                </div>

                <div id="loginError" class="login-error hidden" role="alert"></div>

                <button id="loginButton" class="login-submit" type="submit">로그인</button>

                <div class="auth-switch">
                    <span>아직 계정이 없으신가요?</span>
                    <a href="/signup">회원가입</a>
                </div>
            </form>
        </div>
        <p class="login-footer">MIA · Instagram Message Automation</p>
    </section>
</main>
<script src="/js/login.js"></script>
</body>
</html>
