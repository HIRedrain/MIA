<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>게시물 수정 · MIA</title><link rel="stylesheet" href="/css/mia.css"></head><body>
<div class="app-shell">
<aside class="sidebar">
  <a class="brand" href="/admin"><div class="brand-mark">M</div><div><div class="brand-title">MIA</div><div class="brand-sub">cozy automation</div></div></a>
  <nav class="nav">
    <a href="/admin" class=""><span class="ico">⌂</span><span>대시보드</span></a>
    <a href="/admin/posts" class="active"><span class="ico">▦</span><span>게시물 관리</span></a>
  </nav>
</aside>
<main class="main">

<div class="topbar">
  <div><div class="eyebrow">Update post</div><h1>게시물 수정</h1><p class="subcopy">Instagram 원본 정보는 유지하고 상품·키워드·DM 설정만 수정합니다.</p></div>
</div>
<section class="card form-card">
  <div id="ig-preview"></div>
  <form id="post-form" style="margin-top:22px">
    <div class="form-grid">
      <div class="field"><label for="productName">제품명</label><input id="productName" name="productName" required maxlength="100"></div>
      <div class="field"><label for="keyword">댓글 키워드</label><input id="keyword" name="keyword" required maxlength="30"></div>
      <div class="field full"><label for="productURL">제품 URL</label><input id="productURL" name="productURL" type="url" required></div>
      <div class="field full"><label for="dmMessage">DM 메시지</label><textarea id="dmMessage" name="dmMessage" required></textarea></div>
    </div>
    <div class="form-actions"><a id="cancel-link" class="btn btn-secondary" href="/admin/posts">취소</a><button class="btn btn-primary" type="submit">수정 완료</button></div>
  </form>
</section>
</main></div><script src="/js/common.js"></script><script src="/js/post-update.js"></script></body></html>
