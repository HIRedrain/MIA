<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 · MIA</title><link rel="stylesheet" href="/css/mia.css"></head><body>
<div class="app-shell">
<th:block th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></th:block>
<main class="main">

<div class="topbar">
  <div><div class="eyebrow">Admin</div><h1>오늘도 포근하게 운영해요.</h1><p class="subcopy">Instagram 게시물과 자동 DM 설정을 한눈에 관리할 수 있어요.</p></div>
  <div class="actions">
    <a class="btn btn-primary" href="/admin/posts/create">＋ 새 게시물 등록</a>
    <a href="/" class="admin-home-button" aria-label="홈으로 이동" title="홈">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 1 0 2.354 7.854L3 7.207V13.5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5V7.207l.646.647a.5.5 0 0 0 .708-.708zM12 6.207V13.5a.5.5 0 0 1-.5.5H10v-4.5A1.5 1.5 0 0 0 8.5 8h-1A1.5 1.5 0 0 0 6 9.5V14H4.5a.5.5 0 0 1-.5-.5V6.207l4-4zM9 14H7V9.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5z"/>
      </svg>
    </a>
  </div>
</div>
<section class="grid stats">
  <div class="card stat"><div class="stat-label">등록 게시물</div><div id="stat-total" class="stat-value">-</div><div class="stat-note">MIA에서 관리 중</div></div>
  <div class="card stat"><div class="stat-label">최근 게시물</div><div id="stat-recent" class="stat-value">-</div><div class="stat-note">Instagram 업로드 기준</div></div>
  <div class="card stat"><div class="stat-label">관리 상태</div><div class="stat-value" style="font-size:22px">정상</div><div class="stat-note">Post API 연결 상태</div></div>
</section>
<section class="card panel">
  <div class="toolbar"><div><h2>최근 게시물</h2><p class="subcopy">최근 등록된 게시물을 빠르게 확인하세요.</p></div><a class="btn btn-secondary" href="/admin/posts">전체 보기</a></div>
  <div id="recent-list"></div>
</section>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</main></div><script src="/js/common.js"></script><script src="/js/admin.js"></script></body></html>
